<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Trade results</title>
  <link rel="stylesheet" href="style.css">
  <script src="../i18n.js"></script>
  <script src="gamedata.js"></script>
</head>
<body class="results">
  <header class="res-head">
    <div class="res-title" id="title">Trade results</div>
    <div class="dim" id="sub"></div>
    <div class="note" id="note"></div>
    <div class="price-banner hidden" id="priceBanner"></div>
    <div class="toolbar">
      <label data-i18n="Sort">Sort <select id="sort">
        <option value="res" data-i18n="Resistances first">Resistances first</option>
        <option value="upgrade" data-i18n="Best upgrade">Best upgrade</option>
        <option value="gear" data-i18n="Best gear score">Best gear score</option>
        <option value="value" data-i18n="Best value (upgrade per divine)">Best value (upgrade per divine)</option>
        <option value="price" data-i18n="Cheapest">Cheapest</option>
        <option value="site" data-i18n="Trade site order">Trade site order</option>
      </select></label>
      <label><input type="checkbox" id="onlyUp"> <span data-i18n="Upgrades only">Upgrades only</span></label>
      <label data-i18n="Show">Show <select id="modCount">
        <option value="3" data-i18n="3 mods">3 mods</option><option value="4" data-i18n="4 mods">4 mods</option><option value="5" data-i18n="5 mods">5 mods</option>
        <option value="6" data-i18n="6 mods">6 mods</option><option value="8" data-i18n="8 mods">8 mods</option><option value="all" data-i18n="all mods">all mods</option>
      </select></label>
      <span class="grow"></span>
      <button id="save" data-i18n="☆ Save search" data-i18n-title="Save this search so you can re-run it later" title="Save this search so you can re-run it later">☆ Save search</button>
      <button id="site" data-i18n="Open on trade site" data-i18n-title="Open these results on the trade site in your browser" title="Open these results on the trade site in your browser">Open on trade site</button>
      <button id="gsHelpBtn" class="link" data-i18n="What's the gear score?" data-i18n-title="How the gear score and the UPGRADE / SIDEGRADE verdicts work" title="How the gear score and the UPGRADE / SIDEGRADE verdicts work">What's the gear score?</button>
      <span class="dim small" id="hideHint" data-i18n="Esc hides">Esc hides</span>
    </div>
    <div id="gsHelp" class="gs-panel hidden"></div>
  </header>
  <main id="list" class="res-list"></main>
  <div class="row center"><button id="more" data-i18n="Load 10 more">Load 10 more</button><span id="moreMsg" class="note"></span></div>
  <script src="render.js"></script>
  <script src="results.js"></script>
</body>
</html>
